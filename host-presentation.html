<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1122">
<title>软件可以拆，工作可以接着做 · MyAvaloniaManagement</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a1122;
    --panel: #101b31;
    --ink: #f0f5ff;
    --muted: #afbdd7;
    --line: #2a3a57;
    --accent: #68e7e0;
    --violet: #bbaaff;
    --amber: #ffd282;
    font-family: "Inter", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .4; }
  a { color: var(--accent); text-underline-offset: .2em; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .shell { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; position: relative; isolation: isolate; }
  .shell::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at 80% 34%, #25366866, transparent 54%),
      radial-gradient(ellipse at 13% 100%, #14555c40, transparent 52%),
      linear-gradient(#8ba8df0b 1px, transparent 1px), linear-gradient(90deg, #8ba8df0b 1px, transparent 1px), var(--bg);
    background-size: auto, auto, 48px 48px, 48px 48px, auto;
  }
  .top, .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px clamp(16px, 4vw, 64px); background: #0a1122ed;
  }
  .top { border-bottom: 1px solid var(--line); }
  .foot { border-top: 1px solid var(--line); position: sticky; bottom: 0; z-index: 3; }
  .brand { display: flex; gap: 10px; align-items: center; font-weight: 750; letter-spacing: .02em; }
  .brand svg { width: 28px; height: 28px; color: var(--accent); flex: none; }
  .controls { display: flex; flex: none; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); border-radius: 10px; background: #14223b;
    padding: 8px 13px; line-height: 1.4; font-size: 14px; transition: background .2s, border-color .2s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); background: #1a354b; }
  .btn.primary { background: var(--accent); color: #101c2b; border-color: transparent; font-weight: 750; }
  .btn.primary:hover:not(:disabled) { background: #a2fff8; color: #101c2b; }
  .counter { font: 700 15px "IBM Plex Mono", Consolas, monospace; color: var(--accent); white-space: nowrap; }
  .progress { display: block; flex: 1; min-width: 32px; height: 4px; overflow: hidden; border-radius: 4px; background: var(--line); }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--accent)); transition: width .34s ease; }
  .hint { color: var(--muted); font-size: 13px; white-space: nowrap; }
  main { width: min(100%, 1500px); margin: auto; padding: clamp(22px, 4vw, 64px) clamp(18px, 5vw, 78px); }
  .slide { min-width: 0; animation: enter .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes trace { from { transform: scaleX(0); } }
  .section-label {
    color: var(--accent); font-size: 13px; font-weight: 750; letter-spacing: .16em;
    display: flex; align-items: center; gap: 10px; margin: 0 0 10px;
  }
  .section-label::before { content: ""; width: 24px; height: 1px; background: currentColor; }
  h1, h2, h3, p { margin: 0; }
  h1, h2 { line-height: 1.16; letter-spacing: -.036em; text-wrap: balance; }
  .slide :is(h1, h2)[tabindex="-1"]:focus { outline: none; }
  h1 { font-size: clamp(44px, 6.4vw, 102px); }
  h2 { font-size: clamp(30px, 4vw, 60px); }
  h3 { font-size: clamp(18px, 2vw, 27px); line-height: 1.35; }
  .lead { font-size: clamp(16px, 1.62vw, 23px); line-height: 1.65; color: var(--muted); max-width: 52ch; margin-top: 12px; }
  .accent { color: var(--accent); }
  .hero { display: grid; grid-template-columns: 1.13fr 1fr; gap: 24px; align-items: center; }
  .hero .lead { margin: 22px 0; max-width: 27em; }
  .hero .btn { padding: 11px 18px; }
  .hero-figure { width: 100%; max-height: 505px; overflow: visible; }
  .orbit { transform-origin: 300px 220px; animation: orbit 18s linear infinite; }
  .orbit.reverse { animation-direction: reverse; animation-duration: 25s; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .signal { stroke-dasharray: 12 22; animation: signal 2.4s linear infinite; }
  @keyframes signal { to { stroke-dashoffset: -68; } }
  .core { transform-origin: 300px 220px; animation: core 4s ease-in-out infinite; }
  @keyframes core { 50% { transform: scale(1.045); } }
  .visual { margin-top: clamp(18px, 2.4vw, 34px); }
  .pyramid { display: grid; gap: 12px; justify-items: center; }
  .pyramid .tier, .pyramid-links { animation: enter .45s ease-out both; }
  .pyramid .tier:nth-child(2) { animation-delay: .11s; }
  .pyramid-links { animation-delay: .22s; }
  .tier {
    display: grid; place-items: center; width: var(--width); text-align: center; min-height: 58px;
    background: linear-gradient(100deg, #13515b, #182f56 55%, #353263);
    clip-path: polygon(var(--inset) 0, calc(100% - var(--inset)) 0, 100% 100%, 0 100%);
    padding: 14px var(--inset); font-size: clamp(16px, 2.15vw, 28px); font-weight: 750;
  }
  .pyramid-links { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pyramid-links button { text-align: left; background: #10223a; border-bottom: 3px solid var(--color); padding: 14px; }
  .pyramid-links strong { display: block; color: var(--color); font-size: clamp(15px, 1.8vw, 24px); }
  .pyramid-links span { display: block; margin-top: 5px; color: var(--muted); }
  .interaction { display: grid; gap: 12px; }
  .choices { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .choice {
    color: var(--muted); background: #111d34; border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 12px; font-size: clamp(13px, 1.3vw, 17px);
    transition: border-color .2s, background .2s, color .2s;
  }
  .choice:hover { border-color: var(--accent); color: var(--ink); }
  .choice[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: #163746; }
  .choice[aria-pressed="true"] .step-number { color: var(--accent); }
  .step-number { font-family: Consolas, monospace; margin-right: 6px; color: #8598b9; }
  .interaction-body { display: grid; gap: 15px; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); align-items: stretch; }
  .scene {
    min-width: 0; min-height: clamp(235px, 26vw, 350px); position: relative; overflow: hidden;
    display: grid; align-items: center; padding: clamp(12px, 2vw, 28px);
    border: 1px solid var(--line); border-radius: 18px;
    background: radial-gradient(ellipse at 45% 54%, #1b395b 0, transparent 78%), #0e192e;
  }
  .reading {
    min-width: 0; border-left: 2px solid var(--accent); padding: clamp(12px, 2.3vw, 28px);
    align-content: center; background: linear-gradient(90deg, #20374c7a, #15223a44); border-radius: 0 14px 14px 0;
  }
  .reading h3 { color: var(--accent); }
  .reading p { color: var(--ink); font-size: clamp(15px, 1.45vw, 20px); line-height: 1.62; margin-top: 9px; }
  .reading.swap { animation: swap .34s ease both; }
  @keyframes swap { from { opacity: .45; transform: translateX(6px); } }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .actions .hint { white-space: normal; }
  details { margin-top: 14px; color: var(--muted); font-size: 15px; line-height: 1.65; }
  summary { width: fit-content; cursor: pointer; color: var(--violet); }
  details p { max-width: 78ch; margin-top: 7px; }
  .desk { position: relative; width: 100%; min-height: 210px; font-size: clamp(11px, 1.15vw, 16px); }
  .window {
    position: relative; width: 90%; min-width: 0; overflow: hidden; border: 1px solid #607ca6;
    border-radius: 12px; background: #111e32; box-shadow: 0 14px 30px #0309199c;
  }
  .winbar { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 30px; padding: 6px 9px; background: #263a59; }
  .winctrl { letter-spacing: .2em; color: #b4c7e7; white-space: nowrap; }
  .menus { padding: 7px 10px; display: flex; gap: clamp(8px, 1.4vw, 22px); color: var(--muted); border-bottom: 1px solid var(--line); }
  .window-grid { min-height: 144px; display: grid; grid-template-columns: 29% 1fr; }
  .tools-side, .doc-side { padding: 10px; min-width: 0; transition: background .35s; }
  .tools-side { border-right: 1px solid var(--line); color: var(--muted); }
  .doc-side { display: grid; align-content: start; gap: 9px; }
  .doc-tab { color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 6px; overflow-wrap: anywhere; }
  .doc-line { height: 5px; border-radius: 4px; background: #416182; width: 76%; opacity: .7; }
  .doc-line:nth-child(even) { width: 55%; }
  .floating {
    position: absolute; right: 0; bottom: 0; z-index: 1; width: 42%;
    transform: translate(-130%, -40%) scale(.82); transform-origin: bottom right; opacity: 0; visibility: hidden;
    transition: transform .7s cubic-bezier(.2,.75,.24,1.15), opacity .34s, visibility .7s;
  }
  .floating .float-content { padding: 10px; color: var(--muted); }
  .palette {
    position: absolute; z-index: 2; top: 24%; left: 20%; width: 61%; padding: 9px;
    border: 1px solid var(--violet); border-radius: 9px; background: #222446;
    opacity: 0; transform: translateY(-9px); visibility: hidden;
    transition: opacity .25s, transform .25s, visibility .25s;
  }
  .palette strong { display: block; color: var(--violet); margin-bottom: 4px; }
  .desk[data-view="float"] .floating, .desk[data-view="return"] .floating, .desk[data-view="restart"] .floating {
    transform: translate(0) scale(1); opacity: 1; visibility: visible;
  }
  .desk[data-view="return"] .floating {
    transform: translate(-155%, -30%) scale(.76); opacity: 0; visibility: hidden;
  }
  .desk[data-view="palette"] .palette { opacity: 1; visibility: visible; transform: translateY(0); }
  .desk[data-view="doc"] .doc-side { background: #21505a6e; }
  .desk[data-view="return"] .doc-side { animation: dock-beacon .75s ease-out both; }
  @keyframes dock-beacon {
    40% { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 30px #68e7e044; }
    to { background: #21505a6e; }
  }
  .desk[data-view="tools"] .tools-side { background: #21505a6e; color: var(--ink); }
  .desk[data-view="close"] .window:first-child { opacity: .43; }
  .desk .window:first-child { transition: opacity .4s; }
  .tile { display: grid; gap: 7px; align-content: start; padding: clamp(11px, 2vw, 24px); min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: #121f36; }
  .tile strong { color: var(--accent); font-size: clamp(15px, 1.65vw, 23px); overflow-wrap: anywhere; }
  .tile span { color: var(--muted); font-size: clamp(13px, 1.4vw, 19px); line-height: 1.5; }
  .sketch .interaction-body { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .sketch .scene { padding: clamp(11px, 1.7vw, 22px); }
  .sketch-app {
    min-width: 0; overflow: hidden; border: 1px solid #5f7393; border-radius: 11px;
    background: #0d182b; box-shadow: 0 12px 22px #050a1766;
  }
  .sketch-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 10px; color: var(--ink); background: #293952; font-size: 13px;
  }
  .sketch-actions { display: flex; gap: 12px; padding: 6px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .sketch-actions span { white-space: nowrap; }
  .module-map { display: grid; justify-items: center; padding: 10px; }
  .feature-module {
    display: grid; grid-template-columns: auto auto; align-items: center; gap: 7px;
    border: 1px dashed #61708b; border-radius: 7px; color: var(--muted);
    padding: 5px 10px; font-size: 13px; background: #17233a;
  }
  .feature-module span { font-size: 11px; color: var(--muted); }
  .branch {
    display: block; width: 100%; height: 24px; color: var(--amber);
    opacity: 0; transition: opacity .24s;
  }
  .branch path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .module {
    min-width: 0; display: grid; gap: 5px; padding: 7px 5px; text-align: center;
    border: 1px solid #40516f; background: #17253d; border-radius: 7px;
    font-size: clamp(11px, 1.14vw, 15px); line-height: 1.2; transition: border-color .28s, background .3s;
  }
  .module span { font-size: 11px; color: var(--muted); }
  .package-track {
    display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 25px; margin-top: 8px;
    border: 1px dashed #40516f; border-radius: 6px; width: 100%; color: var(--muted); font-size: 12px;
  }
  .package-track strong { color: var(--ink); }
  .demo-monolith[data-state="change"] .feature-module, .demo-monolith[data-state="release"] .feature-module {
    color: #1f1720; background: var(--amber); border-color: var(--amber); border-style: solid;
  }
  .demo-monolith[data-state="change"] .feature-module span, .demo-monolith[data-state="release"] .feature-module span { color: #442b18; }
  .demo-monolith[data-state="change"] .feature-module { animation: insert-module .5s cubic-bezier(.2,.8,.3,1.25) both; }
  @keyframes insert-module { from { opacity: .35; transform: translateY(-13px) scale(.92); } }
  .demo-monolith:is([data-state="change"], [data-state="release"]) .branch { opacity: 1; }
  .demo-monolith:is([data-state="change"], [data-state="release"]) .branch path { stroke-dashoffset: 0; transition: stroke-dashoffset .55s .1s ease-out; }
  .demo-monolith[data-state="change"] .module { border-color: #d49c61; background: #3a2c2b; animation: module-flash .8s .36s both; }
  @keyframes module-flash { from { box-shadow: 0 0 0 #ffd28200; } 34% { box-shadow: 0 0 14px #ffd28265; } }
  .demo-monolith[data-state="release"] .package-track { border-color: var(--amber); border-style: solid; background: #3a2c2b; animation: module-flash .85s; }
  .demo-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, .65fr) minmax(0, 1fr); align-items: center; gap: 7px; }
  .demo-split .sketch-bar { background: #3c3357; }
  .sketch-document { display: grid; gap: 6px; min-height: 84px; padding: 9px; font-size: 12px; color: var(--muted); }
  .sketch-document strong { color: var(--ink); overflow-wrap: anywhere; }
  .sketch-document i { display: block; width: 90%; height: 4px; border-radius: 4px; background: #526486; }
  .sketch-document i:last-child { width: 68%; }
  .handoff { position: relative; display: grid; justify-items: center; gap: 7px; color: var(--violet); text-align: center; font-size: 12px; }
  .handoff::before { content: ""; position: absolute; top: 11px; left: 0; right: 0; border-top: 1px dashed currentColor; opacity: .65; }
  .handoff svg { position: relative; width: 24px; height: 26px; padding: 2px; background: #15213b; }
  .demo-split[data-state="transfer"] .handoff svg { animation: transfer-file 1.5s ease-in-out both; }
  @keyframes transfer-file {
    from { transform: translateX(clamp(-72px, -5vw, -24px)); opacity: .4; }
    to { transform: translateX(clamp(24px, 5vw, 72px)); }
  }
  .demo-split[data-state="transfer"] .sketch-app:last-child { border-color: var(--violet); animation: module-flash .8s .8s both; }
  .demo-split[data-state="duplicate"] .sketch-actions { background: #352b50; color: var(--ink); }
  .dialogue { align-content: start; display: grid; gap: 7px; padding: 10px 13px; }
  .dialogue > h3 { font-size: clamp(16px, 1.55vw, 23px); }
  .chat { display: grid; gap: 7px; list-style: none; margin: 0; padding: 0; }
  .chat li { justify-self: start; width: fit-content; max-width: 94%; padding: 6px 9px; border: 1px solid #405777; border-radius: 4px 11px 11px; background: #172940; font-size: clamp(13px, 1.18vw, 16px); line-height: 1.45; }
  .chat li:nth-child(2) { justify-self: end; border-color: #5b4d78; border-radius: 11px 4px 11px 11px; background: #272541; }
  .chat strong { display: block; margin-bottom: 2px; font-size: 11px; color: var(--accent); }
  .chat li:nth-child(2) strong { color: var(--violet); }
  .chat li:nth-child(3) strong { color: var(--amber); }
  .dialogue.swap li { animation: enter .38s ease-out both; }
  .dialogue.swap li:nth-child(2) { animation-delay: .13s; }
  .dialogue.swap li:nth-child(3) { animation-delay: .26s; }
  .host-scene.scene {
    background: radial-gradient(ellipse at 48% 48%, #243d62 0, transparent 78%),
      repeating-linear-gradient(90deg, #90bdf00b 0 1px, transparent 1px 24px), #0d192c;
  }
  .demo-frame { display: grid; align-items: center; gap: 9px; min-width: 0; width: 100%; }
  .frame-pair { grid-template-columns: minmax(0, 1fr) minmax(25px, .22fr) minmax(0, 1fr); }
  .frame-pair.direct { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .frame-trio { grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr) 22px minmax(0, 1fr); }
  .frame-window {
    display: grid; min-width: 0; border: 1px solid #61799d; border-radius: 10px; overflow: hidden;
    background: #111e34; box-shadow: 0 8px 21px #060b1b75;
  }
  .frame-window.good { border-color: #53b6ae; }
  .frame-window.warn { border-color: #b98850; }
  .frame-window.bad { border-color: #cb707d; }
  .frame-window.dim { border-style: dashed; opacity: .72; }
  .frame-bar {
    display: flex; gap: 6px; justify-content: space-between; align-items: center;
    padding: 5px 8px; min-height: 26px; color: var(--ink); background: #293d5b;
    font-size: clamp(11px, 1vw, 14px); line-height: 1.3;
  }
  .frame-window.good .frame-bar { background: #1a4350; }
  .frame-window.warn .frame-bar { background: #493b35; }
  .frame-window.bad .frame-bar { background: #4c2c3c; }
  .frame-body { display: grid; gap: 5px; padding: 8px; min-width: 0; }
  .frame-row {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 3px 6px; min-width: 0; padding: 5px 6px; border-radius: 5px;
    background: #20324c; color: var(--ink); font-size: clamp(11px, 1vw, 14px); overflow-wrap: anywhere;
  }
  .frame-row.dim { opacity: .70; background: #1a2941; }
  .frame-row.removed { opacity: .65; border: 1px dashed #687a96; background: transparent; }
  .frame-row.good { background: #1d414a; }
  .frame-row.warn { background: #4c3b33; }
  .frame-row.bad { background: #48283b; }
  .frame-row.flash { animation: frame-flash .75s ease-out both; }
  @keyframes frame-flash { from { box-shadow: inset 0 0 0 1px var(--accent); filter: brightness(1.42); } }
  .badge { font-size: 11px; font-weight: 700; color: var(--muted); }
  .frame-row.good .badge, .frame-status.good { color: var(--accent); }
  .frame-row.warn .badge, .frame-status.warn { color: var(--amber); }
  .frame-row.bad .badge, .frame-status.bad { color: #ffadba; }
  .frame-status { color: var(--muted); font-size: clamp(12px, 1.1vw, 15px); text-align: center; }
  .transit { display: grid; justify-items: center; gap: 4px; min-width: 0; color: #84a4d0; text-align: center; }
  .transit strong { font-size: 11px; overflow-wrap: anywhere; }
  .signal-track { position: relative; display: grid; align-items: center; width: 100%; height: 15px; }
  .signal-track::before { content: ""; width: 100%; border-top: 1px dashed currentColor; opacity: .68; }
  .signal-track i { position: absolute; inset-inline-start: 0; width: 8px; height: 8px; background: currentColor; border-radius: 50%; opacity: 0; }
  .transit.go { color: var(--accent); }
  .transit.stop { color: #ffadba; }
  .transit.go .signal-track i { opacity: 1; box-shadow: 0 0 8px currentColor; animation: send-packet .8s ease-out both; }
  .transit.reverse .signal-track i { animation-direction: reverse; }
  .transit.stop .signal-track i { opacity: 1; inset-inline-start: calc(50% - 4px); border-radius: 2px; }
  @keyframes send-packet { from { left: 0; } to { left: calc(100% - 8px); } }
  .file-object {
    display: grid; justify-items: center; gap: 4px; min-width: 0; padding: 7px;
    color: var(--accent); text-align: center; font-size: clamp(11px, 1.15vw, 16px);
  }
  .file-object svg { width: 28px; height: 31px; color: inherit; }
  .file-object strong { color: var(--ink); overflow-wrap: anywhere; }
  .file-object .badge { color: inherit; }
  .file-object.violet { color: var(--violet); }
  .file-object.warning { color: var(--amber); }
  .file-object.arrive { animation: insert-module .48s ease-out both; }
  .demo-tabs { display: flex; gap: 4px; min-height: 28px; flex-wrap: wrap; padding: 5px 5px 0; border-bottom: 1px solid var(--line); }
  .demo-tab {
    padding: 4px 7px; border-radius: 5px 5px 0 0; color: var(--muted); background: #20334e;
    font: inherit; font-size: 11px; border: 1px solid transparent; line-height: 1.25;
  }
  .demo-tab.active { background: #1e4450; color: var(--ink); border-bottom-color: var(--accent); }
  .demo-tab.leaving { animation: tab-leave .56s ease-out both; visibility: hidden; pointer-events: none; }

function mountInteraction(slide) {
  const root = stage.querySelector(".interaction");
  const choices = root.querySelector("[data-step-choices]");
  const scene = root.querySelector(".scene");
  const reading = root.querySelector(".reading");
  const forward = root.querySelector("[data-step-next]");
  const play = root.querySelector("[data-step-play]");
  const variantButtons = [...root.querySelectorAll("[data-variant]")];
  let option = 0;
  let step = 0;
  let timer;
  const steps = () => slide.variants ? slide.variants[option].steps : slide.steps;

  function pause() {
    clearInterval(timer);
    timer = undefined;
    play.textContent = "自动播放";
    play.setAttribute("aria-pressed", "false");
  }
  stopPlayback = pause;

  function draw() {
    const story = steps();
    const [, title, body, state] = story[step];
    reading.querySelector("h3").textContent = title;
    if (hasDialogue(slide)) {
      updateSketch(scene, slide.visual, body);
      const messages = state.map(([speaker, message]) => {
        const item = document.createElement("li");
        const name = document.createElement("strong");
        name.textContent = speaker;
        item.append(name, message);
        return item;
      });
      reading.querySelector(".chat").replaceChildren(...messages);
    } else {
      reading.querySelector("p").textContent = body;
    }
    if (slide.visual === "host") scene.innerHTML = hostDemos[slide.demo](step, option);
    reading.classList.remove("swap");
    void reading.offsetWidth;
    reading.classList.add("swap");
    choices.querySelectorAll("[data-step]").forEach((button, index) => button.setAttribute("aria-pressed", index === step));
    if (slide.visual === "desk") {
      const desk = scene.querySelector(".desk");
      desk.dataset.view = state;
      const documentDock = slide.mode === "document-dock";
      const fullStory = slide.mode === "full-story";
      desk.querySelector("#float-title").textContent = documentDock ? "文档浮窗" : fullStory ? "检查工具" : "工具浮窗";
      desk.querySelector("#float-content").textContent = documentDock ? "插件文档（原实例）" :
        fullStory && state === "float" ? "检查结果 · 1 处待核对" :
        fullStory ? "检查面板已就绪" : "插件辅助工具";
      const tab = desk.querySelector("#document-tab");
      tab.textContent = state === "restart" ? "打开文档…" :
        documentDock && state === "float" ? "文档已移到浮窗" :
        state === "close" ? "文档已保存并关闭" :
        fullStory && step === 0 ? "工作台已就绪" : "插件文档";
      desk.querySelectorAll(".doc-line").forEach(line => {
        line.hidden = ["close", "restart"].includes(state) || tab.textContent !== "插件文档";
      });
      desk.querySelector("#tool-state").textContent = state === "restart" ? "已恢复工具布局" :
        fullStory && state === "float" ? "检查工具已浮动" :
        fullStory ? "检查工具" : "辅助工具";
      desk.querySelector(".floating").setAttribute("aria-hidden", !["float", "restart"].includes(state));
      desk.querySelector(".palette").setAttribute("aria-hidden", state !== "palette");
    }
    if (slide.visual === "compare") {
      scene.querySelectorAll(".compare-card").forEach((card, index) => {
        const [headline, description, labels] = state[index];
        card.querySelector("b").textContent = headline;
        card.querySelector("p").textContent = description;
        card.querySelectorAll(".mini-map span").forEach((label, labelIndex) => {
          label.textContent = labels[labelIndex];
        });
        card.classList.remove("update");
        void card.offsetWidth;
        card.classList.add("update");
      });
    }
    forward.textContent = step < story.length - 1 ? "下一步" : "重新演示";
  }

  function buildSteps() {
    choices.innerHTML = steps().map(([label], index) =>
      `<button class="choice" data-step="${index}" type="button"><span class="step-number" aria-hidden="true">${index + 1}</span>${label}</button>`).join("");
    variantButtons.forEach((button, index) => button.setAttribute("aria-pressed", index === option));
    draw();
  }

  root.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.hasAttribute("data-variant")) {
      pause();
      option = Number(button.dataset.variant);
      step = 0;
      buildSteps();
    } else if (button.hasAttribute("data-step") || button.hasAttribute("data-demo-step")) {
      pause();
      step = Number(button.dataset.step ?? button.dataset.demoStep);
      draw();
      if (button.hasAttribute("data-demo-step")) choices.querySelector(`[data-step="${step}"]`).focus();
    } else if (button === forward) {
      pause();
      step = (step + 1) % steps().length;
      draw();
    } else if (button === play) {
      if (timer) {
        pause();
        return;
      }
      if (step === steps().length - 1) {
        step = 0;
        draw();
      }
      play.textContent = "暂停播放";
      play.setAttribute("aria-pressed", "true");
      timer = setInterval(() => {
        step += 1;
        draw();
        if (step === steps().length - 1) pause();
      }, 3800);
    }
  });
  buildSteps();
}

function interactionMarkup(slide) {
  const dialogue = hasDialogue(slide);
  const visualClass = slide.visual === "compare" ? "comparison" : dialogue ? "sketch" : "";
  return `<div class="interaction visual ${visualClass}">
    ${slide.variants ? `<div class="choices" role="group" aria-label="选择演示情景">${slide.variants.map((variant, index) =>
      `<button class="choice" data-variant="${index}" type="button">${variant.label}</button>`).join("")}</div>` : ""}
    <div class="choices" data-step-choices role="group" aria-label="选择演示步骤"></div>
    <div class="interaction-body">
      <div class="scene${slide.visual === "host" ? " host-scene" : ""}">${sceneMarkup(slide)}</div>
      <div class="reading${dialogue ? " dialogue" : ""}" aria-live="polite" aria-atomic="true"><h3></h3>${dialogue ? '<ol class="chat" aria-label="示意对话"></ol>' : "<p></p>"}</div>
    </div>
    <div class="actions">
      <button class="btn" data-step-next type="button">下一步</button>
      <button class="btn" data-step-play aria-pressed="false" type="button">自动播放</button>
      ${slide.demo === "pluginLoading" ? '<button class="btn" data-slide="lifecycle" type="button">继续看初始化 →</button>' : ""}
      ${dialogue ? '<span class="hint">软件示意</span>' : slide.visual === "desk" ? '<span class="hint">工作台示意</span>' : ""}
    </div>
  </div>`;
}

function display(index, focus = true) {
  if (!Number.isInteger(index) || index < 0 || index >= count || index === current) return;
  stopPlayback();
  stopPlayback = () => {};
  current = index;
  const slide = slides[index];
  const leads = {
    pyramid: "先看 Host 的职责全景，再沿感兴趣的一项下钻。",
    end: "可以直接回看操作，也可以在项目仓库中继续查接入和验证资料。"
  };
  const heading = `<p class="section-label">${slide.group}</p><h2 tabindex="-1">${slide.title}</h2>`;
  const body = slide.kind === "pyramid" ? pyramid() : slide.kind === "end" ? endPage() : interactionMarkup(slide);
  stage.innerHTML = `<section class="slide" aria-label="第 ${index + 1} 页">
    ${slide.kind === "cover" ? cover() : `${heading}<p class="lead">${slide.lead ?? leads[slide.kind]}</p>${body}
    ${slide.detail ? `<details><summary>查看技术细节</summary><p>${slide.detail}</p></details>` : ""}`}
  </section>`;
  if (!slide.kind) mountInteraction(slide);
  previous.disabled = index === 0;
  next.disabled = index === count - 1;
  document.querySelector("#counter").textContent = `${String(index + 1).padStart(2, "0")} / ${count}`;
  document.querySelector("#progress").style.width = `${(index + 1) * 100 / count}%`;
  document.querySelector("#announcement").textContent = `第 ${index + 1} 页，共 ${count} 页`;
  window.scrollTo(0, 0);
  if (focus) stage.querySelector("h1, h2").focus({ preventScroll: true });
}

function goToPage(page) {
  if (catalog.open) catalog.close();
  display(page - 1);
}

function goToSlide(id) {
  display(slides.findIndex(slide => slide.id === id));
}

stage.addEventListener("click", event => {
  const link = event.target.closest("[data-slide]");
  if (link) goToSlide(link.dataset.slide);
});
previous.addEventListener("click", () => display(current - 1));
next.addEventListener("click", () => display(current + 1));
document.querySelector("#overview").addEventListener("click", () => goToSlide("overview"));
document.querySelector("#open-toc").addEventListener("click", () => {
  const toc = document.querySelector("#toc");
  toc.innerHTML = slides.map((slide, index) =>
    `<button class="btn" data-page="${index + 1}" type="button"${index === current ? ' aria-current="page"' : ""}>
      <span>${String(index + 1).padStart(2, "0")}</span>${slide.short ?? slide.title}</button>`).join("");
  catalog.showModal();
  toc.querySelector('[aria-current="page"]').focus();
});
catalog.addEventListener("click", event => {
  const link = event.target.closest("[data-page]");
  if (link) goToPage(Number(link.dataset.page));
  else if (event.target === catalog) {
    const box = catalog.getBoundingClientRect();
    if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) catalog.close();
  }
});

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    document.querySelector("#announcement").textContent = "浏览器未进入全屏，可使用浏览器的全屏快捷键。";
    fullscreen.textContent = "全屏（F11）";
  }
}
fullscreen.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", () => {
  fullscreen.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
});
document.addEventListener("keydown", event => {
  if (catalog.open || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  const interactive = event.target.closest("button, a, summary, input, select, textarea, [contenteditable]");
  const pageKeys = { ArrowRight: current + 1, PageDown: current + 1, ArrowLeft: current - 1, PageUp: current - 1, Home: 0, End: count - 1 };
  if (Object.hasOwn(pageKeys, event.key)) {
    event.preventDefault();
    display(pageKeys[event.key]);
  } else if (event.key === " " && !interactive) {
    event.preventDefault();
    display(current + 1);
  } else if (event.key.toLowerCase() === "f" && !interactive) {
    event.preventDefault();
    void toggleFullscreen();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopPlayback();
});
display(0, false);
</script>
</body>
</html>
